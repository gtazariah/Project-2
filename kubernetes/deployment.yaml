apiVersion: apps/v1
kind: Deployment
metadata:
  name: trend-react-app
spec:
    replicas: 2
    
    selector:
      matchLabels:
        app: trend-react-app

    template:
      metadata:
        labels:
          app: trend-react-app

      spec:
        containers:
          - name: trend-react-app
            image: azariahgt/trend-react-app:1.0
            ports:
              - containerPort: 3000
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "500Mi"
                cpu: "500m"